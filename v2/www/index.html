        <li>

                <span class="name"> {{#if type}} الجزء {{else}} الحزب{{/if}} {{arNum this.index}} </span>
            </a>
        </li>

                        <div class="item-title-row">
                            <div class="item-title sName">سورة {{s_name}}</div>

                        </div>

                    </div>
                </a>
            </div>
            <div class="swipeout-actions-right">
                <a href="#" class="swipeout-delete removeBookmark" data-index="{{index}}">  حذف <i class="fa fa-times" aria-hidden="true"></i></a>
            </div>
        </li>
    </script>
    <script type="text/template7" id="pageLayout">
        <div class="pages navbar-fixed toolbar-fixed">
            <div data-page="{{page_name}}" class="page {{page_class}}">
                {{#if navbar}}
                <div class="navbar normal-navbar">
                    <div class="navbar-inner">
                        <div class="left">
                            <a href="#" class="link icon-only open-panel"><i class="fa fa-bars"></i></a> {{#js_compare "this.page_name != 'bookmarks'"}}
                            <a href="#" class="link icon-only open-bookmark"><i class="fa fa-bookmark"></i></a> {{/js_compare}}
                        </div>
                        <div class="center sliding">
                            {{#if q_page}}
                            <div class="title-navbar">
                                {{#if S_name}} <span class="souraName">سورة {{S_name}}</span>{{/if}} {{#if juzNumber}}<small class="juzNumber">الجزء {{juzNumber}}</small>{{/if}} {{#if hizbNumber}}<small class="hizbNumber"> الحزب {{hizbNumber}}</small>{{/if}}
                            </div>
                            {{else}}
                            <span>{{page_title}}</span> {{/if}}
                        </div>
                        <div class="right">
                            <a href="#" class="link  icon-only back">
                                <i class="fa fa-chevron-left"></i>
                            </a>
                        </div>

                    </div>
                </div>
                {{/if}} {{#if toolbar}}
                <div class="toolbar toolbar-bottom ">
                    <div class="toolbar-inner">
                        {{#if links}}
                        <a href='#page-{{js " this.pageNum - 1 "}}' class="button button-big previousPage">
                            <i class="fa fa-chevron-right"></i>
                        </a>
                        <div class="swiper-pageNum"> <a href="#" class="button button-big current_page">{{pageNum}}</a></div>
                        <a href='#page-{{js " this.pageNum + 1 "}}' class="button button-big nextPage">
                            <i class="fa fa-chevron-left"></i>
                        </a>
                        {{/if}}
                    </div>
                </div>
                {{/if}} {{#if searchbar}}
                <div class="toolbar toolbar-bottom search-bar">
                    <div class="toolbar-inner searchbarbox">
                        <form class="searchbar searchbar-{{page_name}}">
                            <div class="searchbar-input">
                                <input type="search" placeholder="بحث بأسماء السور ">
                                <a href="#" class="searchbar-clear"></a>
                            </div><a href="#" class="searchbar-cancel">إلغاء</a>
                        </form>
                    </div>
                </div>
                {{/if}}
                <div class="page-content page-background {{#if contentClass}} {{contentClass}} {{/if}}" data-layout="{{layout}}" {{#if pageNum}} data-p="{{pageNum}}" {{/if}} {{#if souraIndex}} data-s="{{souraIndex}}" {{/if}}
				{{#if infinitedist}} data-distance ="{{distance}}"{{/if}}>
                    {{#js_compare "this.layout == 'list'"}}
                    <div class="list-block {{#if blockClass}} {{blockClass}} {{/if}}" {{#if customID}} id="{{customID}}" {{/if}}>
                        <ul></ul>
                    </div>
                    {{else}}
                    <div class="content-block  {{#if blockClass}} {{blockClass}} {{/if}} " {{#if customID}} id="{{customID}}" {{else}}{{#if pageNum}} id="souar-continer-{{pageNum}}" {{/if}} {{/if}}>
                        {{#if q_page}}
                          <div class="bgleft"></div>
                          <div class="bgright"></div>
                          <div class="bgtop"></div>
                          <div class="bgbottom"></div>
                        {{/if}}
                       {{#if swiper}}
                        <div class="swiper-container swiper-container-{{pageNum}} ">
                            <div class="swiper-wrapper">
                            </div>
                        </div>
                        {{/if}}
                    </div>
                    {{/js_compare }}

                    {{#if infinite}}
                        <div class="infinite-scroll-preloader" style="display:none">
                            <div class="preloader"></div>
                        </div>
                    {{/if}}
                </div>

                {{#if actionbotton}}
                  <a href="#" class="floating-button color-green backtotop" ><i class="fa fa-chevron-up"></i></a>
                {{/if}}

            </div>
        </div>
    </script>
    <script id="souratemplate" type="text/template7">
        <div class="soura" data-Sindex="{{index}}" data-n="{{tname}}">
            {{#if showTitle}}
            <header>
                <h3>سورة {{name}}</h3>
            </header>
            {{/if}} {{#js_compare "this.index != '1' && this.index != '9' && this.showTitle"}}
            <div class="title-soura">﷽</div>
            {{/js_compare}}
            <div class="ayat" id="ayatList-{{page}}">
            
                {{#each ayat}}
                 <span class="tooltip" data-i="{{id}}" data-a="{{aya}}">
                 <b>
                 {{text}}
                   </b><small>&nbsp;{{js "getArabicNumbers(this.aya)"}}&nbsp;</small>
                 </span>
                 {{/each}}
            </div>
        </div>
    </script>
